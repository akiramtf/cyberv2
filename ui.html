<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-day Phishing Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-dark: #2563eb;
            --secondary-color: #64748b;
            --background-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            animation: fadeInUp 0.6s ease-out 0.2s backwards;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .input-group .label-hint {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-left: 0.5rem;
        }

        .input-group textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-family: 'Monaco', 'Consolas', monospace;
            resize: vertical;
            min-height: 150px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f8fafc;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background-color: #ffffff;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background-color: white;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #f1f5f9;
            color: var(--text-primary);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-out;
        }

        .status.info {
            background-color: #eff6ff;
            color: #1e40af;
            border: 1px solid #dbeafe;
        }

        .status.error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fee2e2;
        }

        .status.show {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .result-item {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            transition: all 0.2s;
            animation: slideIn 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        .result-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }

        .result-item.safe::before {
            background-color: var(--success-color);
        }

        .result-item.phishing::before {
            background-color: var(--danger-color);
        }

        .result-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .url-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
            min-width: 0;
        }

        .result-icon {
            font-size: 1.25rem;
        }

        .result-url {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1rem;
        }

        .badges {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.critical {
            background-color: #fef2f2;
            color: #991b1b;
        }

        .badge.high {
            background-color: #fff7ed;
            color: #9a3412;
        }

        .badge.medium {
            background-color: #fffbeb;
            color: #92400e;
        }

        .badge.low {
            background-color: #f0fdf4;
            color: #166534;
        }

        .badge.safe {
            background-color: #f0fdf4;
            color: #15803d;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .loading {
            text-align: center;
            padding: 3rem 1rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        .keyboard-hint {
            display: inline-flex;
            align-items: center;
            padding: 0.1rem 0.4rem;
            background: #e2e8f0;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-primary);
            margin: 0 0.2rem;
            border-bottom: 1px solid #cbd5e1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 2rem;
            }

            .card {
                padding: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .url-container {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Zero-day Phishing Detector</h1>
            <p>Advanced ML-based analysis for real-time threat detection</p>
        </div>

        <div class="card">
            <div class="input-group">
                <label for="urlInput">
                    URLs to Analyze
                    <span class="label-hint">(one per line)</span>
                </label>
                <textarea id="urlInput" spellcheck="false"
                    placeholder="https://example.com&#10;http://suspicious-site.net/login&#10;https://secure-bank-verify.com"></textarea>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="analyzeUrls()" id="analyzeBtn">
                    <span>🔍</span> Analyze URLs
                </button>
                <button class="btn-secondary" onclick="clearResults()">
                    <span>🗑️</span> Clear Results
                </button>
            </div>

            <div id="status" class="status"></div>
            <div id="stats" class="stats" style="display: none;"></div>
            <div id="results" class="results"></div>
        </div>

        <div class="footer">
            <p>
                <strong>Pro Tip:</strong> Press <span class="keyboard-hint">Ctrl</span> + <span
                    class="keyboard-hint">Enter</span> to analyze instantly
            </p>
            <p style="margin-top: 0.5rem; opacity: 0.7;">
                Powered by Hybrid Deep Learning • 57 Features
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type} show`;
            if (type === 'info') {
                setTimeout(() => status.classList.remove('show'), 5000);
            }
        }

        function showLoading() {
            const results = document.getElementById('results');
            results.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color: var(--text-primary); font-weight: 500;">Analyzing URLs...</p>
                    <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">Extracting features and running ML models</p>
                </div>
            `;
        }

        function clearResults() {
            document.getElementById('urlInput').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('status').classList.remove('show');
            document.getElementById('urlInput').focus();
        }

        async function analyzeUrls() {
            const input = document.getElementById('urlInput').value.trim();
            const analyzeBtn = document.getElementById('analyzeBtn');

            if (!input) {
                showStatus('Please enter at least one URL to analyze', 'error');
                return;
            }

            const urls = input.split('\n')
                .map(url => url.trim())
                .filter(url => url.length > 0);

            if (urls.length === 0) {
                showStatus('Please enter valid URLs', 'error');
                return;
            }

            analyzeBtn.disabled = true;
            showLoading();

            try {
                const endpoint = urls.length === 1 ? '/predict' : '/batch_predict';
                const payload = urls.length === 1 ? { url: urls[0] } : { urls: urls };

                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();

                if (urls.length === 1) {
                    displayResults([data]);
                } else {
                    displayResults(data.predictions);
                    displayStats(data);
                }

                showStatus(`Analysis complete! Processed ${urls.length} URL${urls.length > 1 ? 's' : ''}`, 'info');

            } catch (error) {
                document.getElementById('results').innerHTML = '';
                let errorMsg = error.message;
                if (errorMsg.includes('Failed to fetch')) {
                    errorMsg = 'Cannot connect to API server. Ensure backend is running.';
                }
                showStatus(errorMsg, 'error');
                console.error('Error:', error);
            } finally {
                analyzeBtn.disabled = false;
            }
        }

        function displayStats(data) {
            const statsDiv = document.getElementById('stats');
            statsDiv.style.display = 'grid';
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${data.total_urls}</div>
                    <div class="stat-label">Total URLs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--danger-color)">${data.phishing_count}</div>
                    <div class="stat-label">Phishing Detected</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--success-color)">${data.legitimate_count}</div>
                    <div class="stat-label">Safe URLs</div>
                </div>
            `;
        }

        function displayResults(predictions) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            predictions.forEach(result => {
                const isPhishing = result.is_phishing;
                const icon = isPhishing ? '🚨' : '🛡️';
                const statusClass = isPhishing ? 'phishing' : 'safe';

                const riskLevel = result.risk_level.toUpperCase();

                const resultHtml = `
                    <div class="result-item ${statusClass}">
                        <div class="result-header">
                            <div class="url-container">
                                <span class="result-icon">${icon}</span>
                                <span class="result-url" title="${escapeHtml(result.url)}">${escapeHtml(result.url)}</span>
                            </div>
                            <div class="badges">
                                <span class="badge ${result.risk_level}">${riskLevel} RISK</span>
                            </div>
                        </div>
                        <div class="result-details">
                            <div class="detail-item">
                                <span class="detail-label">Verdict</span>
                                <span class="detail-value" style="color: ${isPhishing ? 'var(--danger-color)' : 'var(--success-color)'}">
                                    ${isPhishing ? 'PHISHING' : 'SAFE'}
                                </span>
                            </div>
                            <div class="detail-item">
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Score</span>
                                <span class="detail-value">${result.phishing_score.toFixed(3)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Source</span>
                                <span class="detail-value" style="text-transform: capitalize;">${result.prediction_source}</span>
                            </div>
                        </div>
                    </div>
                `;
                resultsDiv.innerHTML += resultHtml;
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('urlInput').addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                analyzeUrls();
            }
        });

        window.addEventListener('load', function () {
            document.getElementById('urlInput').focus();
        });
    </script>
</body>

</html>
